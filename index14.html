<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Luyện tập nhúng CSS</title>
    <style>
        .internal-text {
            color: green;
        }
    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 style="color: red;">Phần 1: Tiêu đề sử dụng inline-style</h1>
    <p style="color: red;">Đây là đoạn văn sử dụng inline-style.</p>

    <h1 class="internal-text">Phần 2: Tiêu đề sử dụng internal-style</h1>
    <p class="internal-text">Đây là đoạn văn sử dụng internal-style.</p>

    <h1 class="external-text">Phần 3: Tiêu đề sử dụng external-style</h1>
    <p class="external-text">Đây là đoạn văn sử dụng external-style.</p>

</body>
</html>
