<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực Hành Bootstrap Grid, Margin/Padding & Display</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row g-3">
            <div class="col-md-4 d-flex justify-content-center align-items-center bg-white p-4 border rounded shadow-sm">
                <p class="mb-0 fw-bold">Phần 1 (Grid + Flexbox)</p>
            </div>
            <div class="col-md-4 d-flex justify-content-center align-items-center bg-secondary p-4 text-white rounded shadow-sm">
                <p class="mb-0 fw-bold">Phần 2 (Grid + Flexbox)</p>
            </div>
            <div class="col-md-4 d-flex justify-content-center align-items-center bg-white p-4 border rounded shadow-sm">
                <p class="mb-0 fw-bold">Phần 3 (Grid + Flexbox)</p>
            </div>
        </div>
    </div>

    <div class="container my-5 py-3 bg-white shadow-sm rounded border">
        <h3 class="text-center text-primary mb-0">Khoảng cách được điều chỉnh bằng Margin & Padding</h3>
    </div>

    <div class="container mb-5">
        <div class="d-none d-md-block bg-warning text-dark text-center p-3 rounded shadow-sm mb-3">
            <p class="mb-0 fw-semibold">⚠️ Nội dung này chỉ hiển thị trên màn hình lớn hơn 768px (Desktop/Tablet ngang)</p>
        </div>

        <div class="d-block d-md-none bg-info text-white text-center p-3 rounded shadow-sm">
            <p class="mb-0 fw-semibold">📱 Nội dung này chỉ hiển thị trên màn hình Mobile (dưới 768px)</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
