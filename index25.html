<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Layout Web</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        #main {
            width: 960px;
            margin: 0 auto;
        }

        #head {
            height: 100px;
            background: #ddd;
            margin-bottom: 10px;
        }

        #head-link {
            height: 30px;
            background: #ccc;
            margin-bottom: 10px;
        }

        #left {
            width: 200px;
            height: 400px;
            background: #eee;
            float: left;
        }

        #content {
            width: 550px;
            height: 400px;
            background: #fff;
            float: left;
            margin-left: 10px;
            margin-right: 10px;
        }

        #right {
            width: 190px;
            height: 400px;
            background: #eee;
            float: left;
        }

        #footer {
            clear: both;
            height: 50px;
            background: #333;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div id="main">
        <div id="head"></div>
        <div id="head-link"></div>
        <div id="left"></div>
        <div id="content"></div>
        <div id="right"></div>
        <div id="footer"></div>
    </div>

</body>
</html>
