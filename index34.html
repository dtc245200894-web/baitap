<!DOCTYPE html>
<html>
<head>
    <style>
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr); 
            
           
            grid-row-gap: 20px; 
            
          
            grid-column-gap: 10px; 

            background: #f1f1f1;
            padding: 10px;
        }
        .item {
            background: #3498db;
            color: white;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="grid-container">
        <div class="item">Hàng 1 - Ô 1</div>
        <div class="item">Hàng 1 - Ô 2</div>
        <div class="item">Hàng 1 - Ô 3</div>
        <div class="item">Hàng 2 - Ô 1</div>
        <div class="item">Hàng 2 - Ô 2</div>
        <div class="item">Hàng 2 - Ô 3</div>
    </div>

</body>
</html>
