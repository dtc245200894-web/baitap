<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Ví dụ về Đường viền và Định kiểu Bảng trong CSS</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
        }

        th {
            height: 50px;
            text-align: left;
            background-color: #f2f2f2;
            color: #333;
        }

        td {
            vertical-align: bottom;
            text-align: left;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <th>Tiêu đề 1</th>
            <th>Tiêu đề 2</th>
            <th>Tiêu đề 3</th>
        </tr>
        <tr>
            <td>Nội dung 1</td>
            <td>Nội dung 2</td>
            <td>Nội dung 3</td>
        </tr>
        <tr>
            <td>Nội dung 4</td>
            <td>Nội dung 5</td>
            <td>Nội dung 6</td>
        </tr>
    </table>

</body>
</html>
