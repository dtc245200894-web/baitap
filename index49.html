<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Đăng Ký Tài Khoản</title>
  
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                
             
                <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5 bg-white">
                    
                  
                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-primary">Đăng Ký Tài Khoản</h2>
                        <p class="text-muted">Vui lòng điền đầy đủ thông tin bên dưới để tham gia hệ thống.</p>
                    </div>

                 
                    <form>
                      
                        <div class="mb-3">
                            <label for="fullName" class="form-label fw-semibold">Họ và tên</label>
                            <input type="text" class="form-control" id="fullName" placeholder="Nhập họ và tên của bạn" required>
                        </div>

                    
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Địa chỉ Email</label>
                            <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                            <div class="form-text text-muted">Chúng tôi sẽ không bao giờ chia sẻ email của bạn với ai khác.</div>
                        </div>

                     
                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold">Mật khẩu</label>
                            <input type="password" class="form-control" id="password" placeholder="Nhập mật khẩu mạnh" required>
                        </div>

                       
                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label fw-semibold">Xác nhận mật khẩu</label>
                            <input type="password" class="form-control" id="confirmPassword" placeholder="Nhập lại mật khẩu" required>
                        </div>

                     
                        <div class="mb-3">
                            <label class="form-label fw-semibold d-block">Giới tính</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="gender" id="genderMale" value="male" checked>
                                <label class="form-check-label" for="genderMale">Nam</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="gender" id="genderFemale" value="female">
                                <label class="form-check-label" for="genderFemale">Nữ</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="gender" id="genderOther" value="other">
                                <label class="form-check-label" for="genderOther">Khác</label>
                            </div>
                        </div>

                     
                        <div class="mb-3">
                            <label class="form-label fw-semibold d-block">Sở thích</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="hobbyReading" value="reading">
                                <label class="form-check-label" for="hobbyReading">Đọc sách</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="hobbySports" value="sports">
                                <label class="form-check-label" for="hobbySports">Thể thao</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="hobbyMusic" value="music">
                                <label class="form-check-label" for="hobbyMusic">Âm nhạc</label>
                            </div>
                        </div>

                       
                        <div class="mb-4">
                            <label for="country" class="form-label fw-semibold">Quốc gia</label>
                            <select class="form-select" id="country" required>
                                <option value="" selected disabled>-- Chọn quốc gia của bạn --</option>
                                <option value="vn">Việt Nam</option>
                                <option value="us">Hoa Kỳ (United States)</option>
                                <option value="jp">Nhật Bản (Japan)</option>
                                <option value="kr">Hàn Quốc (South Korea)</option>
                            </select>
                        </div>

                       
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg shadow-sm">Đăng Ký Ngay</button>
                        </div>

                    </form>

                
                    <div class="text-center mt-4">
                        <p class="text-muted small mb-0">Bằng cách đăng ký, bạn đồng ý với <a href="#" class="text-decoration-none">Điều khoản & Chính sách</a> của chúng tôi.</p>
                    </div>

                </div>

            </div>
        </div>
    </div>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
