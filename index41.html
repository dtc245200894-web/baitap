<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ví dụ Flex-grow</title>
    <style>
        .flex-container {
            display: flex;
            gap: 10px;
            background-color: #f1f1f1;
            padding: 10px;
        }

        .flex-item {
            background-color: #3498db;
            color: white;
            padding: 20px;
            text-align: center;
            flex-grow: 0;
        }

       
        .div-thu-hai {
            background-color: #e74c3c;
            flex-grow: 2; 
        }
    </style>
</head>
<body>

    <div class="flex-container">
        <div class="flex-item">Div 1</div>
        <div class="flex-item div-thu-hai">Div 2 (flex-grow: 2)</div>
        <div class="flex-item">Div 3</div>
        <div class="flex-item">Div 4</div>
        <div class="flex-item">Div 5</div>
    </div>

</body>
</html>
