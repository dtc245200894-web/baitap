<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    .container {
    display: grid;
    grid-template-columns: 1fr 3fr;
    grid-template-areas: 
        "header header"
        "nav nav"
        "sidebar main"
        "footer footer";
    gap: 10px;
    min-height: 100vh;
}

.header { grid-area: header; background: #333; color: white; padding: 20px; text-align: center; }
.nav { grid-area: nav; background: #444; color: white; padding: 10px; }
.main { grid-area: main; background: #f4f4f4; padding: 20px; }
.sidebar { grid-area: sidebar; background: #ddd; padding: 20px; }
.footer { grid-area: footer; background: #333; color: white; padding: 20px; text-align: center; }

/* Responsive cho Mobile */
@media (max-width: 768px) {
    .container {
        grid-template-columns: 1fr;
        grid-template-areas: 
            "header"
            "nav"
            "main"
            "sidebar"
            "footer";
    }
}
</style>
<body>
    <div class="container">
        <header class="header">Header</header>
        <nav class="nav">Navigation</nav>
        <main class="main">Main Content</main>
        <aside class="sidebar">Sidebar</aside>
        <footer class="footer">Footer</footer>
    </div>
</body>
</html>
