<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Form Đăng Ký Người Dùng</title>
</head>
<body>

    <h2>Form Đăng Ký Người Dùng</h2>
    
    <form action="http://demo.codegym.vn/6/registration_form/register.php" method="POST">
        Họ và tên: <input type="text" name="name"><br><br>
        Email: <input type="email" name="email"><br><br>
        Số điện thoại: <input type="text" name="phone"><br><br>
        
        Giới tính: 
        <input type="radio" name="gender" value="Nam"> Nam
        <input type="radio" name="gender" value="Nữ"> Nữ
        <br><br>

        <input type="submit" value="Đăng ký">
    </form>

</body>
</html>
