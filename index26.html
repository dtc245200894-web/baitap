<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Layout HTML5</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        #main {
            width: 960px;
            margin: 0 auto;
        }

        header {
            height: 100px;
            background: #ddd;
            margin-bottom: 10px;
        }

        nav {
            height: 30px;
            background: #ccc;
            margin-bottom: 10px;
        }

        aside {
            width: 200px;
            height: 400px;
            background: #eee;
            float: left;
        }

        section {
            width: 550px;
            height: 400px;
            background: #fff;
            float: left;
            margin: 0 10px;
        }

        footer {
            clear: both;
            height: 50px;
            background: #333;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div id="main">
        <header></header>
        <nav></nav>
        <aside></aside>
        <section></section>
        <aside></aside>
        <footer></footer>
    </div>

</body>
</html>
