<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Responsive Image Gallery</title>
    <style>
        body {
            background-color: #111;
            color: white;
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .item {
            background-color: #222;
            border: 1px solid #333;
            box-sizing: border-box;
            width: calc(25% - 7.5px);
        }

        .item img {
            width: 100%;
            height: auto;
            display: block;
        }

        .desc {
            padding: 10px;
            text-align: center;
            font-size: 14px;
        }

        @media (max-width: 700px) {
            .item {
                width: calc(50% - 5px);
            }
        }

        @media (max-width: 500px) {
            .item {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <h1>Responsive Image Gallery</h1>
    <p>Resize the browser window to see the effect.</p>

    <div class="gallery">
        <div class="item">
            <img src="C:\Users\Vieta\Downloads\1-1.png" alt="Ảnh 1">
            <div class="desc">Add a description of the image here</div>
        </div>
        <div class="item">
            <img src="C:\Users\Vieta\Downloads\9.jpg" alt="Ảnh 2">
            <div class="desc">Add a description of the image here</div>
        </div>
        <div class="item">
            <img src="C:\Users\Vieta\Downloads\Isushi.jpeg" alt="Ảnh 3">
            <div class="desc">Add a description of the image here</div>
        </div>
        <div class="item">
            <img src="C:\Users\Vieta\Downloads\mo-hinh-thiet-ke-nha-hang-view-bien-4.jpg" alt="Ảnh 4">
            <div class="desc">Add a description of the image here</div>
        </div>
    </div>

</body>
</html>
