<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bố cục với Float và Overflow</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    .container {
    width: 100%;
    overflow: hidden;
}

.left-column {
    width: 50%;
    float: left;
    background-color: lightgray;
    padding: 20px;
}

.right-column {
    width: 48%;
    float: right;
    background-color: lightgreen;
    padding: 20px;
}

.overflow-box {
    width: 300px;
    height: 100px;
    background-color: lightcoral;
    padding: 10px;
    overflow: auto;
}
</style>

<body>
    <h1>Bố cục trang với float và overflow</h1>
    <div class="container">
        <div class="left-column">Nội dung bên trái</div>
        <div class="right-column">Nội dung bên phải</div>
    </div>
    <div class="overflow-box">
        Đây là nội dung rất dài mà chúng ta kiểm tra overflow. Lorem ipsum dolor sit amet, consectetur adipiscing elit...
    </div>
</body>
</html>
