<!DOCTYPE html>
<html>
<head>
    <style>
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            background: #f1f1f1;
            padding: 10px;
        }
        .item {
            background: #3498db;
            color: white;
            padding: 20px;
            text-align: center;
        }
       
        .item-dac-biet {
            grid-row: 1 / 3; 
            background: #e74c3c;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="grid-container">
        <div class="item item-dac-biet">Ô kéo dài 2 hàng</div>
        <div class="item">Ô 2</div>
        <div class="item">Ô 3</div>
        <div class="item">Ô 4</div>
        <div class="item">Ô 5</div>
    </div>

</body>
</html>
