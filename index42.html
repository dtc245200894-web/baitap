<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ví dụ Flex-flow</title>
    <style>
        .flex-container {
            display: flex;
          
            flex-flow: row wrap; 
            gap: 10px;
            background-color: #f1f1f1;
            padding: 10px;
            width: 300px;
        }

        .flex-item {
            background-color: #3498db;
            color: white;
            padding: 15px;
            text-align: center;
            flex: 1 1 90px;
        }
    </style>
</head>
<body>

    <div class="flex-container">
        <div class="flex-item">1</div>
        <div class="flex-item">2</div>
        <div class="flex-item">3</div>
        <div class="flex-item">4</div>
    </div>

</body>
</html>
