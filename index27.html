<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bố cục với display</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    body {
    font-family: Arial, sans-serif;
    text-align: center;
}

nav a {
    display: inline-block;
    margin: 0 15px;
    text-decoration: none;
    color: #333;
}

section {
    margin-top: 20px;
}

.box {
    display: inline-block;
    width: 30%;
    padding: 20px;
    background-color: lightblue;
    margin: 10px;
}
</style>
<body>
    <h1>Bố cục trang web với display</h1>
    <nav>
        <a href="#">Trang chủ</a>
        <a href="#">Giới thiệu</a>
        <a href="#">Dịch vụ</a>
        <a href="#">Liên hệ</a>
    </nav>
    <section>
        <div class="box">Cột 1</div>
        <div class="box">Cột 2</div>
        <div class="box">Cột 3</div>
    </section>
    <footer>
        <p>Bản quyền &copy; 2024</p>
    </footer>
</body>
</html>
