<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Flexbox Responsive Layout</title>
    <link rel="stylesheet" href="style44.css">
</head>
<body>
    <div class="wrapper">
        <!-- 1. Header -->
        <header class="header">Header: Tiêu đề trang</header>
        
        <!-- 2. Navigation -->
        <nav class="nav">Navigation: Menu điều hướng</nav>
        
        <!-- Khung chứa Main và Sidebar để sắp xếp ngang trên Desktop -->
        <div class="content-container">
            <!-- 3. Main Content -->
            <main class="main">Main Content: Nội dung chính</main>
            
            <!-- 4. Sidebar -->
            <aside class="sidebar">Sidebar: Tin tức, quảng cáo</aside>
        </div>
        
        <!-- 5. Footer -->
        <footer class="footer">Footer: Thông tin cuối trang</footer>
    </div>
</body>
</html>
