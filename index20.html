<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Mô hình hộp CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    .card {
    width: 280px;
    height: 150px;
    padding: 20px;
    border: 5px solid #3498db;
    margin: 20px;
}

.card:nth-child(1) {
    box-sizing: content-box;
    background-color: #2ecc71;
}

.card:nth-child(2) {
    box-sizing: border-box;
    background-color: #f1c40f;
}

.card:nth-child(3) {
    box-sizing: border-box;
    background-color: #e74c3c;
}
</style>
<body>

    <div class="card">Thẻ thứ nhất (content-box)</div>
    <div class="card">Thẻ thứ hai (border-box)</div>
    <div class="card">Thẻ thứ ba (border-box)</div>

</body>
</html>
