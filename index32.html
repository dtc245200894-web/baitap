<!DOCTYPE html>
<html>
<head>
    <style>
        .grid-container {
            display: grid;
            grid-template-columns: 100px 1fr 200px; /* 3 cột */
            gap: 10px;
        }
        .item {
            background: #3498db;
            color: white;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="grid-container">
        <div class="item">Cột 1</div>
        <div class="item">Cột 2</div>
        <div class="item">Cột 3</div>
    </div>

</body>
</html>
