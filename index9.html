<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh sách sản phẩm</title>
    <style>
        /* Thêm một chút đường viền đơn giản cho bảng để dễ nhìn */
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 8px 12px;
        }
    </style>
</head>
<body>

    <h1>Danh sách sản phẩm</h1>

    <table>
        <!-- Hàng tiêu đề của bảng -->
        <tr>
            <th>Tên sản phẩm</th>
            <th>Giá</th>
            <th>Số lượng</th>
        </tr>
        
        <!-- Sản phẩm 1 -->
        <tr>
            <td>Laptop Dell Inspiron</td>
            <td>15.000.000 đ</td>
            <td>5</td>
        </tr>

        <!-- Sản phẩm 2 -->
        <tr>
            <td>Điện thoại iPhone 15</td>
            <td>22.000.000 đ</td>
            <td>10</td>
        </tr>

        <!-- Sản phẩm 3 -->
        <tr>
            <td>Tai nghe Bluetooth</td>
            <td>500.000 đ</td>
            <td>25</td>
        </tr>

        <!-- Sản phẩm 4 -->
        <tr>
            <td>Chuột không dây Logitech</td>
            <td>300.000 đ</td>
            <td>15</td>
        </tr>
    </table>

</body>
</html>
